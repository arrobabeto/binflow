name: binflow-local

services:
  postgres:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: binflow
      POSTGRES_PASSWORD: binflow_local
      POSTGRES_USER: binflow
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U binflow -d binflow']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/local-init.sql:/docker-entrypoint-initdb.d/001-runtime-role.sql:ro

  redis:
    image: redis:8.4.0-alpine
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: binflow
      MINIO_ROOT_PASSWORD: binflow_local_storage
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  clamav:
    image: clamav/clamav-debian:1.4.6
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    ports:
      - '3310:3310'
    volumes:
      - clamav_data:/var/lib/clamav

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ['node', 'apps/api/dist/server.js']
    environment:
      BINFLOW_VERSION: local
      DATABASE_URL: postgresql://binflow_app:binflow_local_app@postgres:5432/binflow
      LOG_LEVEL: info
      PORT: '8080'
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '8080:8080'

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ['node', 'apps/worker/dist/main.js']
    environment:
      DATABASE_URL: postgresql://binflow_app:binflow_local_app@postgres:5432/binflow
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ['node', 'apps/dashboard/.output/server/index.mjs']
    environment:
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: '3000'
      NUXT_PUBLIC_API_BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'

  maintenance:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ['node', 'apps/maintenance/dist/main.js']
    environment:
      DATABASE_URL: postgresql://binflow_app:binflow_local_app@postgres:5432/binflow
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'

volumes:
  clamav_data:
  minio_data:
  postgres_data:
  redis_data:
