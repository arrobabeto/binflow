identity:
  id: edit_text_style
  version: 1
  stack: astro-orbitype
  toolDir: edit-text-style
  graphVersionSuffix: '@1'
  displayName: Edit text style
  command: /edit_text_style
  description: >
    Lets astro_orbitype clients change size, weight, and/or color of one
    allowlisted text field per request without rewriting copy. Reuses
    edit_text targeting (substring, denylist, locale) with a hard guardrail that
    all selected matches share one field kind (e.g. not subtitle + body). Style
    choices are typed for non-technical users: weight Normal/Semibold/Bold,
    size deltas +4/+8/+16/+32 px from current, color hex or 50% darker/lighter
    with up to two hex retries then cancel. Preview applies a temporary
    Orbitype style patch after Vercel is ready; cancel/reject restores the
    snapshot. Client confirms target and plan, reviews preview (approve or
    cancel only), then admin approves before production merge. Isolated from
    edit_text: own CTAs, messages, executor, and style nodeKinds.
  profile: astro_orbitype
  executorId: workflow.edit_text_style@1
  riskClass: medium
  requiresPreview: true
  mutationClass: update
  approvalPolicyId: astro-orbitype-text-style-edit@1

specTitle: Edit text style (Astro + Orbitype) — capability specification

migration:
  inputSchemaId: edit_text_style.input@1
  outputSchemaId: edit_text_style.output@1
  allowedProfiles:
    - astro_orbitype
  requiredPermissions:
    - github:metadata:read
    - github:contents:write
    - github:pull_requests:write
    - github:checks:read
    - github:statuses:read
    - vercel:deployments:read
    - orbitype:content:read
    - orbitype:content:write
  timeoutSeconds: 1800
  retryPolicy:
    maxAttempts: 3
    retryableErrors:
      - provider_retryable
      - deployment_pending
  budget:
    maxEstimatedCostCents: 25
    maxModelCalls: 1
    maxTokens: 500

nodes:
  - sortPrefix: '01'
    id: sync_editable_copy
    kind: effect
    nodeKind: text.sync_editable_copy@1
    label: Sync editable copy corpus
    acceptsClientCustomization: false
    parameters:
      catalogScope: pages
    permissions:
      - orbitype:content:read
      - github:metadata:read
  - sortPrefix: '02'
    id: validate_text_style
    kind: compute
    nodeKind: text.validate_style@1
    label: Validate locale, target, single field kind, and style inputs
    acceptsClientCustomization: false
  - sortPrefix: '03'
    id: render_style_patch
    kind: compute
    nodeKind: text.render_style_patch@1
    label: Build style Orbitype and GitHub patches
    acceptsClientCustomization: false
  - sortPrefix: '04'
    id: open_style_edit_pr
    kind: effect
    nodeKind: text.open_style_edit_pr@1
    label: Open text style edit pull request
    acceptsClientCustomization: false
    permissions:
      - github:contents:write
      - github:pull_requests:write
  - sortPrefix: '05'
    id: wait_preview
    kind: effect
    nodeKind: deployment.wait_preview@1
    label: Wait for Vercel preview
    acceptsClientCustomization: false
    permissions:
      - vercel:deployments:read
  - sortPrefix: '06'
    id: apply_orbitype_preview
    kind: effect
    nodeKind: text.apply_orbitype_style_preview@1
    label: Apply temporary Orbitype style preview patch
    acceptsClientCustomization: false
    permissions:
      - orbitype:content:write
  - sortPrefix: '07'
    id: awaiting_client_approval
    kind: interrupt
    nodeKind: workflow.awaiting_client_approval@1
    label: Awaiting client preview approval
    acceptsClientCustomization: false
    actor: client
    ttlHours: 72
  - sortPrefix: '08'
    id: awaiting_admin_approval
    kind: interrupt
    nodeKind: workflow.awaiting_admin_approval@1
    label: Awaiting admin publication approval
    acceptsClientCustomization: false
    actor: admin
    ttlHours: 72
  - sortPrefix: '09'
    id: merge_github
    kind: effect
    nodeKind: publication.merge_github@1
    label: Merge GitHub PR
    acceptsClientCustomization: false
    permissions:
      - github:pull_requests:write
      - github:contents:write
  - sortPrefix: '10'
    id: publish_orbitype_pages
    kind: effect
    nodeKind: text.publish_orbitype_style_pages@1
    label: Publish Orbitype style pages
    acceptsClientCustomization: false
    permissions:
      - orbitype:content:write
  - sortPrefix: '11'
    id: verify_production
    kind: effect
    nodeKind: text.verify_style_production@1
    label: Verify production styles
    acceptsClientCustomization: false
    permissions:
      - vercel:deployments:read
  - sortPrefix: '12'
    id: completed
    kind: compute
    nodeKind: workflow.completed@1
    label: Completed
    acceptsClientCustomization: false

edges:
  - from: sync_editable_copy
    to: validate_text_style
  - from: validate_text_style
    to: render_style_patch
  - from: render_style_patch
    to: open_style_edit_pr
  - from: open_style_edit_pr
    to: wait_preview
  - from: wait_preview
    to: apply_orbitype_preview
  - from: apply_orbitype_preview
    to: awaiting_client_approval
  - from: awaiting_client_approval
    to: awaiting_admin_approval
  - from: awaiting_admin_approval
    to: merge_github
  - from: merge_github
    to: publish_orbitype_pages
  - from: publish_orbitype_pages
    to: verify_production
  - from: verify_production
    to: completed

contentSchemaFields: []

customizableNodeIds: []

layerAssignments:
  - layer: code
    behavior: >
      Shared discovery helpers only; own executor/CTAs. One fieldKind per
      request; typed weight/size/color via stepped interview (one attribute per
      step; Done after ≥1); hex ≤2 retries then cancel; target-not-found retry
      copy; copy immutable; Orbitype style preview + restore; client then admin
      approval.
  - layer: manifest
    behavior: >
      contentLocales; editablePaths for page copy files; deployment.productionOrigin;
      publicationTargets github+orbitype.
  - layer: customization
    behavior: >
      Optional editorial hints for collection prompts only. No paths, models,
      permissions, or approval overrides.

typedErrors:
  - code: text_target_not_found
    when: Substring search finds no allowlisted string in the chosen locale.
  - code: text_target_ambiguous
    when: Substring matches more than one allowlisted field and client has not disambiguated.
  - code: text_field_denied
    when: Resolved path is H1, button, link, nav, or footer (denylist).
  - code: text_style_mixed_field_kinds
    when: >
      Selection resolves to more than one field kind (e.g. section title and
      paragraph); request cancelled with non-technical client message.
  - code: text_locale_required
    when: Project is multilingual and locale was not closed in collection.
  - code: text_style_empty
    when: Client confirms plan with no style attributes closed.
  - code: text_style_color_invalid
    when: >
      Hex invalid after two collection retries; request cancelled and client told
      to restart with a valid code.
  - code: text_target_stale
    when: Target field no longer matches at execute time.
  - code: orbitype_pages_patch_failed
    when: Orbitype rejects the pages sections style patch (4xx).
  - code: github_pr_failed
    when: Style edit PR cannot be opened or updated.
  - code: preview_not_ready
    when: Vercel preview does not become ready for the PR head.
  - code: production_style_mismatch
    when: Production page does not show the approved styles after publish.

verification:
  scenarios:
    - Existing tools (edit_text, create_*, delete_*, update_menu) unchanged in CTAs and dispatch.
    - Monolingual skips locale; multilingual asks once.
    - Mixed field kinds cancel with clear client message; no style patch applied.
    - Weight/size/color can be combined in one request; at least one required.
    - Copy string is never rewritten; only style attributes change.
    - Invalid hex allows two retries with natural-language example; third failure cancels.
    - Plan confirm and buttons say Apply style / Aplicar estilo — never Publish text or Create draft.
    - Admin notice says change text style (not replace text / delete).
    - Preview Orbitype style patch; cancel/reject restores snapshot; Approve or Cancel only.
    - After client preview approval, admin approval required before merge.
    - NL style phrases (de/es/en) dispatch to edit_text_style, not edit_text.
    - verify_production confirms styles on production origin from enrollment.
  fixtures:
    - docs/customizations/bistro-edit-text-style.md
