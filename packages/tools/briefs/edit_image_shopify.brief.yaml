identity:
  id: edit_image_shopify
  version: 1
  stack: shopify-liquid
  toolDir: edit-image
  graphVersionSuffix: '@1'
  displayName: Edit theme image
  command: /edit_image
  description: >
    Lets shopify_liquid clients replace one allowlisted theme image slot per
    request using the Surface Inventory (kind: image, publication_target:
    github_theme). Opens a GitHub PR with the replacement asset; preview is the
    PR plus a storefront preview query URL (no Vercel, no Shopify Admin, no
    Orbitype). Client preview approve/cancel; admin approval before merge.
  profile: shopify_liquid
  executorId: workflow.edit_image_shopify@1
  riskClass: medium
  requiresPreview: true
  mutationClass: update
  approvalPolicyId: shopify-liquid-image-edit@1

specTitle: Edit theme image (Shopify Liquid) — capability specification

migration:
  inputSchemaId: edit_image_shopify.input@1
  outputSchemaId: edit_image_shopify.output@1
  allowedProfiles:
    - shopify_liquid
  requiredPermissions:
    - github:metadata:read
    - github:contents:write
    - github:pull_requests:write
    - github:checks:read
    - github:statuses:read
  timeoutSeconds: 1800
  retryPolicy:
    maxAttempts: 3
    retryableErrors:
      - provider_retryable
  budget:
    maxEstimatedCostCents: 50
    maxModelCalls: 1
    maxTokens: 1000

nodes:
  - sortPrefix: '01'
    id: sync_inventory_images
    kind: effect
    nodeKind: images.sync_inventory_images@1
    label: Sync inventory image allowlist
    acceptsClientCustomization: false
    permissions:
      - github:metadata:read
  - sortPrefix: '02'
    id: validate_image_edit
    kind: compute
    nodeKind: images.validate_theme_edit@1
    label: Validate inventory target and replacement asset
    acceptsClientCustomization: false
  - sortPrefix: '03'
    id: render_theme_image_patch
    kind: compute
    nodeKind: images.render_theme_patch@1
    label: Build GitHub theme image patch
    acceptsClientCustomization: false
  - sortPrefix: '04'
    id: open_image_edit_pr
    kind: effect
    nodeKind: images.open_theme_edit_pr@1
    label: Open theme image pull request
    acceptsClientCustomization: false
    permissions:
      - github:contents:write
      - github:pull_requests:write
  - sortPrefix: '05'
    id: record_theme_preview
    kind: compute
    nodeKind: images.record_theme_preview@1
    label: Record theme preview URL
    acceptsClientCustomization: false
  - sortPrefix: '06'
    id: awaiting_client_approval
    kind: interrupt
    nodeKind: workflow.awaiting_client_approval@1
    label: Awaiting client preview approval
    acceptsClientCustomization: false
    actor: client
    ttlHours: 72
  - sortPrefix: '07'
    id: awaiting_admin_approval
    kind: interrupt
    nodeKind: workflow.awaiting_admin_approval@1
    label: Awaiting admin publication approval
    acceptsClientCustomization: false
    actor: admin
    ttlHours: 72
  - sortPrefix: '08'
    id: merge_github
    kind: effect
    nodeKind: publication.merge_github@1
    label: Merge GitHub PR
    acceptsClientCustomization: false
    permissions:
      - github:pull_requests:write
      - github:contents:write
  - sortPrefix: '09'
    id: verify_production
    kind: effect
    nodeKind: images.verify_theme_production@1
    label: Verify production storefront
    acceptsClientCustomization: false
  - sortPrefix: '10'
    id: completed
    kind: compute
    nodeKind: workflow.completed@1
    label: Completed
    acceptsClientCustomization: false

edges:
  - from: sync_inventory_images
    to: validate_image_edit
  - from: validate_image_edit
    to: render_theme_image_patch
  - from: render_theme_image_patch
    to: open_image_edit_pr
  - from: open_image_edit_pr
    to: record_theme_preview
  - from: record_theme_preview
    to: awaiting_client_approval
  - from: awaiting_client_approval
    to: awaiting_admin_approval
  - from: awaiting_admin_approval
    to: merge_github
  - from: merge_github
    to: verify_production
  - from: verify_production
    to: completed

contentSchemaFields: []

customizableNodeIds: []

layerAssignments:
  - layer: code
    behavior: >
      Inventory-driven github_theme image slots only. Replace asset via GitHub
      PR. Preview = PR URL + storefront preview query. No Admin API / Orbitype /
      Vercel.
  - layer: manifest
    behavior: >
      surfaceInventoryPath; editablePaths; productionOrigin; publicationTargets
      github_theme.
  - layer: customization
    behavior: >
      Optional collection hints only. No paths, models, or approval overrides.

typedErrors:
  - code: surface_inventory_missing
    when: binflow/surface-inventory.yaml is absent at execute time.
  - code: surface_inventory_empty
    when: Inventory has no kind:image github_theme rows.
  - code: image_target_not_found
    when: Search finds no allowlisted inventory image for the query.
  - code: image_target_ambiguous
    when: Query matches more than one inventory image.
  - code: image_replacement_missing
    when: Client confirms plan without a replacement attachment or URL.
  - code: github_pr_failed
    when: Theme image PR cannot be opened or updated.
  - code: inventory_remap_failed
    when: Deep search / remap could not update surface inventory.
  - code: inventory_remap_pending
    when: Remap is in progress (async webhook path).

verification:
  scenarios:
    - Inventory sync fails closed when YAML missing.
    - Search matches bf_id / section / sample; ambiguous returns numbered list.
    - confirm_target shows current sample path; Confirm / Not this one / Cancel.
    - Replacement accepts Telegram photo or HTTPS URL.
    - Preview message includes PR URL and productionDomain preview query.
    - After client approve, admin approval required before merge.
    - NL ingress edit-image phrases dispatch to edit_image_shopify when bound.
  fixtures: []
